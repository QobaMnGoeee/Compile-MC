name: Build BBS Shell

# Debug APK-ларын құрастырады (universal + arm64-v8a, armeabi-v7a, x86_64, x86).
# Жоба түбірінде gradlew, settings.gradle, app/ қапшығы тұруы керек.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap_tag:
        description: "Bootstrap архивтері жатқан GitHub Release тегі"
        required: false
        default: "bootstrap"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # app/build.gradle және gradle.properties ішіндегі нұсқалармен сәйкес болуы керек
  ANDROID_PLATFORM: "android-30"
  ANDROID_BUILD_TOOLS: "30.0.3"
  ANDROID_NDK: "22.1.7171670"
  # Bootstrap zip файлдары репозиторийде жоқ болса, осы Release-тен жүктеледі
  BOOTSTRAP_TAG: ${{ github.event.inputs.bootstrap_tag || vars.BOOTSTRAP_TAG || 'bootstrap' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}"

      - name: Prepare bootstrap archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          cd app/src/main/cpp
          ARCHS="aarch64 arm i686 x86_64"

          missing() {
            local m=""
            for a in $ARCHS; do [ -f "bootstrap-$a.zip" ] || m="$m bootstrap-$a.zip"; done
            echo "$m"
          }

          if [ -n "$(missing)" ]; then
            echo "Репозиторийде жоқ:$(missing)"
            echo "Release '$BOOTSTRAP_TAG' ішінен жүктеп көреміз..."
            gh release download "$BOOTSTRAP_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'bootstrap-*.zip' \
              --dir . --clobber || true
          fi

          if [ -n "$(missing)" ]; then
            echo "::error title=Bootstrap архивтері жоқ::Табылмады:$(missing). Оларды termux-packages арқылы 'kz.bbsshell.app' префиксімен жинап, '$BOOTSTRAP_TAG' тегімен Release-ке жүктеңіз немесе 'git add -f' арқылы app/src/main/cpp/ ішіне қосыңыз (README.md қараңыз)."
            exit 1
          fi

          for a in $ARCHS; do
            unzip -tq "bootstrap-$a.zip" > /dev/null || { echo "::error::bootstrap-$a.zip бүлінген"; exit 1; }
          done
          ls -l bootstrap-*.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          # <versionName>+<қысқа commit hash> (semver build metadata)
          VERSION_NAME="$(grep -m 1 -E '^\s+versionName "' app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')"
          export BBSSHELL_APP_VERSION_NAME="${VERSION_NAME}+${GITHUB_SHA:0:7}"
          export BBSSHELL_APK_VERSION_TAG="v${BBSSHELL_APP_VERSION_NAME}-github-debug"
          echo "Құрастырылуда: $BBSSHELL_APK_VERSION_TAG"

          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Validate APKs and create checksums
        working-directory: app/build/outputs/apk/debug
        run: |
          set -euo pipefail
          ls -l
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            ls *_"$abi".apk > /dev/null || { echo "::error::$abi APK табылмады"; exit 1; }
          done
          sha256sum *.apk > sha256sums
          cat sha256sums

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: bbsshell-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/sha256sums
            app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
